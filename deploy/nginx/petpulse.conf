# PetPulse — Nginx server block for a subdomain, classic (non-Docker) deployment.
#
#   sudo cp deploy/nginx/petpulse.conf /etc/nginx/sites-available/petpulse
#   sudo ln -s /etc/nginx/sites-available/petpulse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d petpulse.suclinica.com     # adds the TLS listener
#
# Replace petpulse.suclinica.com, the root path and the PHP-FPM socket version.

server {
    listen 80;
    listen [::]:80;
    server_name petpulse.suclinica.com;

    root /var/www/petpulse/public;
    index index.php;
    charset utf-8;

    # Security headers appropriate for a clinical application.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    server_tokens off;

    client_max_body_size 25m;

    # Laravel Reverb (real-time kárdex): WebSocket at /app/{key}, HTTP API at /apps/*.
    location ~ ^/(app|apps)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # keep idle sockets open all day
        proxy_send_timeout 86400s;
    }

    # Vite-hashed assets: cache for a year.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
