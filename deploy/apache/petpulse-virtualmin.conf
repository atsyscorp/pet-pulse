# PetPulse — Apache directives for a Virtualmin virtual server (sub-server/subdomain).
#
# Paste the <IfModule> block into Virtualmin:
#   Web Configuration → Edit Apache Directives → (add to BOTH the :80 and :443 blocks)
# Or append it to /etc/apache2/sites-available/<subdomain>.conf and <subdomain>-ssl.conf,
# then: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite && sudo systemctl reload apache2
#
# Prerequisite: the DocumentRoot of the virtual server must point to Laravel's
# `public/` directory (e.g. /home/petpulse/domains/petpulse.suclinica.com/public_html/public).

<IfModule mod_proxy.c>
    # Laravel Reverb (real-time kárdex). The browser connects to wss://<subdomain>/app/<key>;
    # Apache forwards it to the Reverb process on 127.0.0.1:8080.
    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket upgrade
    ProxyPass        /app  ws://127.0.0.1:8080/app
    ProxyPassReverse /app  ws://127.0.0.1:8080/app

    # Reverb HTTP API (server-side publishing, health check)
    ProxyPass        /apps http://127.0.0.1:8080/apps
    ProxyPassReverse /apps http://127.0.0.1:8080/apps
</IfModule>

<Directory "/home/petpulse/domains/petpulse.suclinica.com/public_html/public">
    AllowOverride All
    Require all granted
</Directory>

# Long-lived cache for Vite-hashed assets.
<LocationMatch "^/build/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
