name: App de propietarios (Flutter)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest

    name: Flutter 3.47 (análisis, pruebas y APK)

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 17 (Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Proves the Android project (Gradle, manifest, signing fallback) builds.
      # Without key.properties it is signed with debug keys: not uploadable.
      - name: Build Android APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://petpulse.atsys.co

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petpulse-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
